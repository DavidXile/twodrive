[package]
name = "twodrive-cfapi-probe"
version = "0.1.7-alpha.2"
edition = "2024"
license = "MIT"
publish = false

# An opt-in native experiment, never loaded by the installed desktop.
[workspace]

[features]
default = []
fixture-probe = ["dep:windows-sys"]
shell-integration = ["fixture-probe", "dep:windows"]
native-local-fixture = ["fixture-probe"]

[[bin]]
name = "twodrive-cfapi-probe"
path = "src/main.rs"
required-features = ["fixture-probe"]

[dependencies]
twodrive-core = { path = "../../crates/twodrive-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
anyhow = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_CorrelationVector", "Win32_System_IO", "Win32_Security", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
windows = { version = "0.62", optional = true, features = ["Storage", "Storage_Search", "Storage_Streams", "Storage_Provider", "Security_Cryptography", "Foundation", "Foundation_Collections", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
